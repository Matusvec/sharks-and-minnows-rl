[project]
name = "sharks-and-minnows-rl"
version = "0.1.0"
description = "Centralized-attention PPO for Sharks and Minnows"
requires-python = ">=3.11"
dependencies = [
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "pygame-ce==2.5.8",
    "tqdm==4.70.0",
    "torch==2.13.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
